<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<!-- Forbids every kind of network send from this page, so the browser itself enforces that files and passwords stay local. The one thing the page may fetch is the tutorial videos, from the site that served it (media-src 'self'). -->
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
		<title>File Encryption</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<style>
			*{
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body{
				font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
				color: #1f2328;
				background: #f6f7f9;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
			}

			main{
				background: #fff;
				padding: 28px 32px;
				border: 1px solid #e3e6eb;
				border-radius: 8px;
				width: 100%;
				max-width: 460px;
			}

			h1{
				font-size: 20px;
				font-weight: 600;
				margin-bottom: 4px;
			}

			.lede{
				color: #5b6470;
				font-size: 13px;
				margin-bottom: 24px;
			}

			.howto{
				margin: -14px 0 22px;
				font-size: 13px;
			}

			.howto summary,
			.howto a{
				color: #3b82f6;
				cursor: pointer;
			}

			.howto video{
				display: block;
				width: 100%;
				height: auto;
				margin: 8px 0 12px;
				border-radius: 6px;
				background: #3b4a6b;
			}

			.field{
				display: block;
				margin-bottom: 16px;
			}

			.label{
				display: block;
				font-size: 13px;
				color: #5b6470;
				margin-bottom: 6px;
			}

			input[type=file],
			input[type=password]{
				width: 100%;
				padding: 8px 10px;
				border: 1px solid #d0d4da;
				border-radius: 4px;
				font: inherit;
				background: #fff;
			}

			input[type=file]{
				padding: 4px;
			}

			input[type=password]:focus{
				outline: none;
				border-color: #3b82f6;
				box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
			}

			#mode{
				font-size: 13px;
				color: #5b6470;
				margin: -8px 0 16px;
				min-height: 20px;
				overflow-wrap: anywhere;
			}

			#mode strong{
				color: #1f2328;
				font-weight: 600;
			}

			button{
				display: block;
				width: 100%;
				padding: 10px;
				margin-top: 8px;
				font: inherit;
				font-weight: 600;
				color: #fff;
				background: #3b82f6;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				transition: background 0.15s;
			}

			button:hover:not(:disabled){
				background: #2563eb;
			}

			button:disabled{
				background: #9ca3af;
				cursor: not-allowed;
			}

			progress{
				display: block;
				width: 100%;
				height: 8px;
				margin-top: 18px;
				accent-color: #3b82f6;
			}

			progress[hidden]{
				display: none;
			}

			#status{
				margin-top: 12px;
				min-height: 22px;
				font-size: 14px;
				color: #5b6470;
				word-break: break-word;
			}

			#status.error{
				color: #b91c1c;
			}

			.spinner{
				display: inline-block;
				width: 14px;
				height: 14px;
				border: 2px solid rgba(0, 0, 0, 0.15);
				border-top-color: #3b82f6;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				vertical-align: -3px;
				margin-right: 8px;
			}

			#download{
				display: inline-block;
				margin-top: 6px;
				color: #3b82f6;
				text-decoration: none;
				font-weight: 600;
				font-size: 14px;
			}

			#download:hover{
				text-decoration: underline;
			}

			#download[hidden]{
				display: none;
			}

			.foot{
				margin-top: 22px;
				padding-top: 14px;
				border-top: 1px solid #eef0f3;
				font-size: 12px;
			}

			.foot a{
				color: #5b6470;
			}

			@keyframes spin{
				to { transform: rotate(360deg); }
			}
		</style>
	</head>
	<body>
		<main>
			<h1>File Encryption</h1>
			<p class="lede">Encrypts or decrypts a file of any size, entirely inside your browser. Choose a file: an encrypted <strong>.enc</strong> file will be decrypted, anything else will be encrypted.</p>

			<div class="howto">
				<details>
					<summary>Watch how to encrypt a folder (20 seconds)</summary>
					<video controls playsinline preload="none" width="1032" height="1026" src="videos/encrypt.mp4" aria-label="Screen recording: zip the folder, choose the zip file on this page, type a password, click Encrypt, then Save."></video>
				</details>
				<details>
					<summary>Watch how to decrypt a file (17 seconds)</summary>
					<video controls playsinline preload="none" width="1032" height="1026" src="videos/decrypt.mp4" aria-label="Screen recording: choose the .enc file on this page, type the password, click Decrypt, then Save, then unzip the result."></video>
				</details>
			</div>

			<label class="field">
				<span class="label">File</span>
				<input type="file" id="file-input">
			</label>

			<div id="mode" aria-live="polite"></div>

			<label class="field">
				<span class="label">Password</span>
				<input type="password" id="password-input" autocomplete="off">
			</label>

			<button id="action" type="button" disabled>Choose a file</button>

			<progress id="progress" max="1000" value="0" hidden></progress>
			<div id="status" role="status" aria-live="polite"></div>
			<a id="download" hidden>Download file</a>
			<p class="foot"><a href="https://github.com/justinpearson/easy-file-encryption">Source code on GitHub</a></p>
		</main>

		<!--
			The crypto core. It has no DOM dependencies so tests/core.test.mjs can lift it out of
			this file and run it under Node. Keep it that way: no document, window, or UI code here.
		-->
		<script id="core">
			(function () {
				'use strict';

				const MAGIC = new Uint8Array([0x45, 0x4e, 0x43, 0x32]); // 'ENC2'
				const SALT_BYTES = 16;
				const NONCE_PREFIX_BYTES = 8;
				const NONCE_BYTES = 12;
				const GCM_TAG_BYTES = 16;
				// magic + salt + nonce prefix + iterations (u32) + chunk size (u32) + filename length (u16)
				const FIXED_HEADER_BYTES = MAGIC.length + SALT_BYTES + NONCE_PREFIX_BYTES + 4 + 4 + 2;
				const DEFAULT_PBKDF2_ITERATIONS = 600_000;
				const DEFAULT_CHUNK_BYTES = 8 * 1024 * 1024;
				const MAX_FILENAME_BYTES = 0xffff;
				// Sanity caps on values read from an untrusted header, so a damaged or hostile
				// file cannot make the browser allocate gigabytes or spin on key derivation.
				const MAX_CHUNK_BYTES = 256 * 1024 * 1024;
				const MAX_PBKDF2_ITERATIONS = 10_000_000;

				function fail(code, message) {
					const e = new Error(message);
					e.code = code;
					return e;
				}

				function u32(n) {
					const b = new Uint8Array(4);
					new DataView(b.buffer).setUint32(0, n);
					return b;
				}

				function view(bytes) {
					return new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
				}

				async function deriveKey(password, salt, iterations, usage) {
					const passwordKey = await crypto.subtle.importKey(
						'raw',
						new TextEncoder().encode(password),
						{ name: 'PBKDF2' },
						false,
						['deriveKey'],
					);
					return crypto.subtle.deriveKey(
						{ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
						passwordKey,
						{ name: 'AES-GCM', length: 256 },
						false,
						[usage],
					);
				}

				// Every chunk gets a distinct 96-bit nonce: 8 random bytes per file, then the
				// chunk index. The key is also unique per file (fresh salt), so nonces never repeat.
				function nonceFor(prefix, index) {
					const n = new Uint8Array(NONCE_BYTES);
					n.set(prefix, 0);
					n.set(u32(index), NONCE_PREFIX_BYTES);
					return n;
				}

				// Authenticated-but-unencrypted data for each chunk: the whole header (so filename,
				// chunk size and KDF settings cannot be altered), the chunk index (so chunks cannot
				// be reordered or dropped) and a last-chunk flag (so the file cannot be truncated).
				function aadFor(header, index, isLast) {
					const a = new Uint8Array(header.length + 5);
					a.set(header, 0);
					a.set(u32(index), header.length);
					a[header.length + 4] = isLast ? 1 : 0;
					return a;
				}

				function buildHeader(salt, prefix, iterations, chunkBytes, nameBytes) {
					const h = new Uint8Array(FIXED_HEADER_BYTES + nameBytes.length);
					const dv = view(h);
					let off = 0;
					h.set(MAGIC, off); off += MAGIC.length;
					h.set(salt, off); off += SALT_BYTES;
					h.set(prefix, off); off += NONCE_PREFIX_BYTES;
					dv.setUint32(off, iterations); off += 4;
					dv.setUint32(off, chunkBytes); off += 4;
					dv.setUint16(off, nameBytes.length); off += 2;
					h.set(nameBytes, off);
					return h;
				}

				async function isEncrypted(file) {
					if (file.size < MAGIC.length) return false;
					const head = new Uint8Array(await file.slice(0, MAGIC.length).arrayBuffer());
					return MAGIC.every((b, i) => head[i] === b);
				}

				async function parseHeader(file) {
					if (!(await isEncrypted(file))) throw fail('not-encrypted', 'This file is not encrypted.');
					if (file.size < FIXED_HEADER_BYTES) throw fail('corrupt', 'The file header is damaged.');
					const fixed = new Uint8Array(await file.slice(0, FIXED_HEADER_BYTES).arrayBuffer());
					const dv = view(fixed);
					let off = MAGIC.length;
					const salt = fixed.slice(off, off + SALT_BYTES); off += SALT_BYTES;
					const prefix = fixed.slice(off, off + NONCE_PREFIX_BYTES); off += NONCE_PREFIX_BYTES;
					const iterations = dv.getUint32(off); off += 4;
					const chunkBytes = dv.getUint32(off); off += 4;
					const nameLength = dv.getUint16(off); off += 2;
					if (iterations === 0 || iterations > MAX_PBKDF2_ITERATIONS) throw fail('corrupt', 'The file header is damaged.');
					if (chunkBytes === 0 || chunkBytes > MAX_CHUNK_BYTES) throw fail('corrupt', 'The file header is damaged.');
					const headerBytes = FIXED_HEADER_BYTES + nameLength;
					if (file.size < headerBytes + GCM_TAG_BYTES) throw fail('corrupt', 'The file header is damaged.');
					const header = new Uint8Array(await file.slice(0, headerBytes).arrayBuffer());
					const name = new TextDecoder().decode(header.subarray(FIXED_HEADER_BYTES));
					return { header, headerBytes, salt, prefix, iterations, chunkBytes, name };
				}

				// Encrypts `file` (a Blob/File) chunk by chunk, passing each output piece to
				// sink.write(Uint8Array) in order. Only one chunk is in memory at a time.
				async function encrypt(file, password, sink, opts = {}) {
					const chunkBytes = opts.chunkBytes || DEFAULT_CHUNK_BYTES;
					const iterations = opts.iterations || DEFAULT_PBKDF2_ITERATIONS;
					const onProgress = opts.onProgress || (() => {});
					if (!Number.isSafeInteger(file.size) || file.size < 0) throw fail('bad-input', 'The input has no valid size.');
					const nameBytes = new TextEncoder().encode(file.name || '');
					if (nameBytes.length > MAX_FILENAME_BYTES) throw fail('bad-input', 'The filename is too long.');

					const salt = crypto.getRandomValues(new Uint8Array(SALT_BYTES));
					const prefix = crypto.getRandomValues(new Uint8Array(NONCE_PREFIX_BYTES));
					const header = buildHeader(salt, prefix, iterations, chunkBytes, nameBytes);
					const key = await deriveKey(password, salt, iterations, 'encrypt');

					await sink.write(header);
					const total = file.size;
					const chunkCount = Math.max(1, Math.ceil(total / chunkBytes));
					for (let i = 0; i < chunkCount; i++) {
						const start = i * chunkBytes;
						const end = Math.min(start + chunkBytes, total);
						const isLast = i === chunkCount - 1;
						const plain = await file.slice(start, end).arrayBuffer();
						const ct = await crypto.subtle.encrypt(
							{ name: 'AES-GCM', iv: nonceFor(prefix, i), additionalData: aadFor(header, i, isLast) },
							key,
							plain,
						);
						await sink.write(new Uint8Array(ct));
						onProgress(end, total);
					}
				}

				// Decrypts `file` chunk by chunk into sink.write(Uint8Array). Throws with
				// e.code === 'auth' on a wrong password or any tampering; nothing is written
				// to the sink in that case unless the damage is past the first chunk.
				async function decrypt(file, password, sink, opts = {}) {
					const onProgress = opts.onProgress || (() => {});
					const h = await parseHeader(file);
					const key = await deriveKey(password, h.salt, h.iterations, 'decrypt');

					const total = file.size;
					const step = h.chunkBytes + GCM_TAG_BYTES;
					let offset = h.headerBytes;
					for (let i = 0; ; i++) {
						const end = Math.min(offset + step, total);
						const isLast = end === total;
						const ct = await file.slice(offset, end).arrayBuffer();
						if (ct.byteLength < GCM_TAG_BYTES) throw fail('corrupt', 'The file is damaged.');
						let plain;
						try {
							plain = await crypto.subtle.decrypt(
								{ name: 'AES-GCM', iv: nonceFor(h.prefix, i), additionalData: aadFor(h.header, i, isLast) },
								key,
								ct,
							);
						} catch (e) {
							throw fail('auth', 'Wrong password, or the file has been damaged.');
						}
						await sink.write(new Uint8Array(plain));
						onProgress(end, total);
						if (isLast) break;
						offset = end;
					}
				}

				globalThis.EFE = {
					encrypt,
					decrypt,
					isEncrypted,
					parseHeader,
					DEFAULT_CHUNK_BYTES,
					DEFAULT_PBKDF2_ITERATIONS,
				};
			})();
		</script>

		<script>
			(function () {
				'use strict';

				const MIN_PASSWORD_LENGTH = 5;
				const ENC_SUFFIX = '.enc';
				const { encrypt, decrypt, isEncrypted, parseHeader } = globalThis.EFE;

				const fileInput = document.getElementById('file-input');
				const passwordInput = document.getElementById('password-input');
				const actionBtn = document.getElementById('action');
				const modeEl = document.getElementById('mode');
				const progressEl = document.getElementById('progress');
				const statusEl = document.getElementById('status');
				const downloadLink = document.getElementById('download');

				let mode = null;        // 'encrypt' | 'decrypt' | null
				let outputName = null;
				let currentDownloadUrl = null;

				function setStatus(text, isError) {
					statusEl.textContent = text;
					statusEl.classList.toggle('error', !!isError);
				}

				function showSpinner(text) {
					statusEl.classList.remove('error');
					statusEl.replaceChildren(
						Object.assign(document.createElement('span'), { className: 'spinner' }),
						document.createTextNode(text),
					);
				}

				function setMode(text, strong) {
					modeEl.replaceChildren(
						document.createTextNode(text),
						Object.assign(document.createElement('strong'), { textContent: strong || '' }),
					);
				}

				function formatMB(bytes) {
					return (bytes / 1024 / 1024).toFixed(bytes < 10 * 1024 * 1024 ? 2 : 0) + ' MB';
				}

				function setDownload(blob, filename) {
					if (currentDownloadUrl) URL.revokeObjectURL(currentDownloadUrl);
					currentDownloadUrl = URL.createObjectURL(blob);
					downloadLink.href = currentDownloadUrl;
					downloadLink.download = filename;
					downloadLink.textContent = `Download again (${filename})`;
					downloadLink.hidden = false;
					downloadLink.click();
				}

				function clearDownload() {
					if (currentDownloadUrl) {
						URL.revokeObjectURL(currentDownloadUrl);
						currentDownloadUrl = null;
					}
					downloadLink.hidden = true;
				}

				// Where the output goes. Chrome and Edge offer showSaveFilePicker, which streams
				// straight to a file on disk so even multi-gigabyte outputs never sit in memory.
				// Other browsers get the output assembled as a Blob and handed to a download link.
				async function openSink(suggestedName) {
					if (typeof window.showSaveFilePicker === 'function') {
						let handle;
						try {
							handle = await window.showSaveFilePicker({ suggestedName });
						} catch (e) {
							if (e.name === 'AbortError') throw e;
							handle = null; // Picker unavailable here; fall through to the Blob path.
						}
						if (handle) {
							const writable = await handle.createWritable();
							return {
								description: `Saved as ${handle.name}.`,
								write: (bytes) => writable.write(bytes),
								close: () => writable.close(),
								abort: () => writable.abort().catch(() => {}),
							};
						}
					}
					const parts = [];
					return {
						description: `Downloaded as ${suggestedName}.`,
						write: (bytes) => { parts.push(new Blob([bytes])); },
						close: () => { setDownload(new Blob(parts), suggestedName); },
						abort: () => { parts.length = 0; },
					};
				}

				function stripEncSuffix(name) {
					return name.toLowerCase().endsWith(ENC_SUFFIX) ? name.slice(0, -ENC_SUFFIX.length) : 'decrypted-' + name;
				}

				fileInput.addEventListener('change', async () => {
					clearDownload();
					setStatus('');
					mode = null;
					outputName = null;
					actionBtn.disabled = true;
					actionBtn.textContent = 'Choose a file';
					setMode('');

					const file = fileInput.files[0];
					if (!file) return;

					try {
						if (await isEncrypted(file)) {
							const header = await parseHeader(file);
							mode = 'decrypt';
							outputName = header.name || stripEncSuffix(file.name);
							setMode('Encrypted file. Decrypting will produce ', outputName);
							actionBtn.textContent = 'Decrypt';
						} else {
							mode = 'encrypt';
							outputName = file.name + ENC_SUFFIX;
							setMode(`${formatMB(file.size)}. Encrypting will produce `, outputName);
							actionBtn.textContent = 'Encrypt';
						}
						actionBtn.disabled = false;
					} catch (e) {
						setStatus(e.code === 'corrupt' ? 'This file is encrypted, but its header is damaged.' : `Could not read the file: ${e.message}`, true);
					}
				});

				actionBtn.addEventListener('click', async () => {
					clearDownload();

					const file = fileInput.files[0];
					const password = passwordInput.value;

					if (!file || !mode) {
						setStatus('Please choose a file.', true);
						return;
					}
					if (mode === 'encrypt' && password.length < MIN_PASSWORD_LENGTH) {
						setStatus(`Password must be at least ${MIN_PASSWORD_LENGTH} characters.`, true);
						return;
					}
					if (mode === 'decrypt' && !password) {
						setStatus('Enter the password.', true);
						return;
					}

					// The save dialog must open while the click is still a fresh user gesture,
					// so it comes before any slow work.
					let sink;
					try {
						sink = await openSink(outputName);
					} catch (e) {
						setStatus(e.name === 'AbortError' ? 'Cancelled.' : `Could not open a place to save the output: ${e.message}`, e.name !== 'AbortError');
						return;
					}

					passwordInput.value = '';
					actionBtn.disabled = true;
					fileInput.disabled = true;
					progressEl.value = 0;
					progressEl.hidden = false;
					const verb = mode === 'encrypt' ? 'Encrypting' : 'Decrypting';
					showSpinner(`${verb}…`);

					const onProgress = (done, total) => {
						progressEl.value = total ? Math.round((done / total) * 1000) : 1000;
						showSpinner(`${verb}… ${formatMB(done)} of ${formatMB(total)}`);
					};

					try {
						if (mode === 'encrypt') await encrypt(file, password, sink, { onProgress });
						else await decrypt(file, password, sink, { onProgress });
						await sink.close();
						setStatus(`${mode === 'encrypt' ? 'Encrypted' : 'Decrypted'}. ${sink.description}`);
					} catch (e) {
						await sink.abort();
						setStatus(e.code ? e.message : `Unexpected error: ${e.message}`, true);
					} finally {
						progressEl.hidden = true;
						actionBtn.disabled = false;
						fileInput.disabled = false;
					}
				});

				passwordInput.addEventListener('keydown', (e) => {
					if (e.key === 'Enter' && !actionBtn.disabled) actionBtn.click();
				});

				// Tutorial videos. Opening a section plays its video and closing it pauses. A copy
				// of this page that was saved or sent on its own has no videos folder beside it, so
				// a video that fails to load is replaced with a link to the hosted copy.
				const HOSTED_URL = 'https://justinpearson.github.io/easy-file-encryption/';
				for (const details of document.querySelectorAll('.howto details')) {
					const video = details.querySelector('video');
					details.addEventListener('toggle', () => {
						if (!video.isConnected) return;
						if (details.open) video.play().catch(() => {});
						else video.pause();
					});
					video.addEventListener('error', () => {
						video.replaceWith(Object.assign(document.createElement('a'), {
							href: HOSTED_URL + video.getAttribute('src'),
							target: '_blank',
							rel: 'noopener',
							textContent: 'Watch this video on the hosted page',
						}));
					});
				}
			})();
		</script>
	</body>
</html>
